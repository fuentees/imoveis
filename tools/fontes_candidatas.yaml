- nome: Na Granja Imóveis - Cotia
  ativo: true
  base_url: https://nagranjaimoveis.com.br
  listagem_url: https://nagranjaimoveis.com.br/imoveis/a-venda/cotia-sp?pagina={page}
  cidade: Cotia
  cidade_auto: true
  cidades_permitidas:
  - Cotia
  paginas: 20
  pular_param_pagina_1: true
  detalhe: false
  seletores:
    card: div.thumbnail_one
    link: a.property-card-link
    titulo: .property_card_heading > .color-primary
    descricao: .card_property_description
    preco: div.property_pricing
    area: .thum_data
    bairro: .property_card_address
