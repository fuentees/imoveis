name: descobrir-fontes

on:
  schedule:
    - cron: "43 11 * * 3"
  workflow_dispatch:
    inputs:
      somente_sondagem:
        description: "Pula a busca no OpenStreetMap e só sonda tools/fontes_candidatas.yaml"
        type: boolean
        default: false
      ciclo_teste:
        description: "Roda um ciclo completo em dry-run (sem Telegram, banco vazio) para conferir a coleta"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  descobrir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Procura e verifica novas imobiliárias
        if: ${{ !inputs.somente_sondagem }}
        run: python tools/descobrir_fontes.py
      - name: Sonda páginas candidatas (tools/fontes_candidatas.yaml)
        if: always()
        run: python tools/sondar_fontes.py
      - name: Ciclo de teste em dry-run (não envia nem altera a branch data)
        if: ${{ inputs.ciclo_teste }}
        run: |
          cp config.example.yaml config.yaml
          python main.py --once --dry-run --relatorio relatorio.json --log-file bot.log || true
          python tools/resumo_ciclo.py >> "$GITHUB_STEP_SUMMARY"
      - name: Publica resumo
        if: always()
        run: cat fontes-descobertas.md fontes-sondadas.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Guarda fila para integração
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fontes-descobertas-${{ github.run_id }}
          path: |
            fontes-descobertas.json
            fontes-descobertas.md
            fontes-sondadas.json
            fontes-sondadas.md
            relatorio.json
            bot.log
          retention-days: 30
          if-no-files-found: warn
