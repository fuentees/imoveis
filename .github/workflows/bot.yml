name: bot-imoveis

on:
  schedule:
    - cron: "0 */3 * * *"      # a cada 3h (UTC); o GitHub pode atrasar alguns minutos
  workflow_dispatch: {}         # botão "Run workflow" pra rodar na hora

concurrency:
  group: bot-imoveis
  cancel-in-progress: false     # nunca deixa dois ciclos se atropelarem

permissions:
  contents: write               # pra empurrar o imoveis.db na branch "data"

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Testes (trava commit ruim antes de raspar)
        run: pytest -q

      - name: Config a partir do exemplo (creds vêm dos secrets)
        run: cp config.example.yaml config.yaml

      - name: Restaura o imoveis.db da branch "data"
        run: |
          if git fetch --depth=1 origin data 2>/dev/null; then
            git cat-file -p FETCH_HEAD:imoveis.db > imoveis.db && echo "db restaurado"
          else
            echo "sem db anterior — começando do zero"
          fi

      - name: Roda um ciclo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --once

      - name: Salva o imoveis.db na branch "data"
        if: always()
        run: |
          test -f imoveis.db || exit 0
          tmp="$(mktemp -d)"; cp imoveis.db "$tmp/"; cd "$tmp"
          git init -q && git checkout -q -b data
          git add imoveis.db
          git -c user.name="bot-imoveis" -c user.email="actions@github.com" \
            commit -qm "estado $(date -u +%FT%TZ) [skip ci]"
          git push -qf \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - name: Guarda o log do ciclo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-log-${{ github.run_id }}
          path: bot.log
          retention-days: 7
          if-no-files-found: ignore
