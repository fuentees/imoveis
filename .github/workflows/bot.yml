name: bot-imoveis

on:
  schedule:
    - cron: "17 */3 * * *"      # a cada 3h (UTC); o GitHub pode atrasar alguns minutos
  push:
    branches: [main]
    paths: ["*.py", "tools/resumo_ciclo.py", "tools/validar_db.py", "config.example.yaml", "requirements*.txt", ".github/workflows/bot.yml"]
  workflow_dispatch:
    inputs:
      max_paginas:
        description: "Máximo de páginas por fonte (0 usa a configuração completa)"
        default: "0"
        type: string

env:
  TZ: America/Sao_Paulo
  PYTHONUTF8: "1"

concurrency:
  group: bot-imoveis
  cancel-in-progress: false     # nunca deixa dois ciclos se atropelarem

permissions:
  contents: write               # pra empurrar o imoveis.db na branch "data"

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Testes (trava commit ruim antes de raspar)
        run: pytest -q

      - name: Config a partir do exemplo (creds vêm dos secrets)
        run: cp config.example.yaml config.yaml

      - name: Restaura o imoveis.db da branch "data"
        id: estado
        shell: bash
        run: |
          set -euo pipefail
          refs=$(git ls-remote --heads origin refs/heads/data)
          if [ -n "$refs" ]; then
            git fetch origin refs/heads/data:refs/remotes/origin/data
            git show refs/remotes/origin/data:imoveis.db > imoveis.db.tmp
            python tools/validar_db.py imoveis.db.tmp
            mv imoveis.db.tmp imoveis.db
          else
            echo "Branch data ainda não existe; primeiro ciclo."
          fi
          echo "pronto=true" >> "$GITHUB_OUTPUT"

      - name: Roda um ciclo
        id: ciclo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_PAGINAS: ${{ github.event_name == 'push' && '2' || inputs.max_paginas || '0' }}
        run: |
          if [[ ! "$MAX_PAGINAS" =~ ^[0-9]+$ ]]; then
            echo "max_paginas deve ser um inteiro não negativo" >&2
            exit 1
          fi
          args=(--once)
          if [ "$MAX_PAGINAS" != "0" ]; then
            args+=(--max-paginas "$MAX_PAGINAS")
          fi
          python main.py "${args[@]}"

      - name: Salva o imoveis.db na branch "data"
        if: ${{ always() && steps.estado.outputs.pronto == 'true' && steps.ciclo.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f imoveis.db || exit 0
          python tools/validar_db.py imoveis.db
          tmp=$(mktemp -d)
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git worktree add --detach "$tmp" refs/remotes/origin/data
          else
            git worktree add --detach "$tmp" HEAD
            git -C "$tmp" checkout --orphan data
            git -C "$tmp" rm -rf .
          fi
          cp imoveis.db "$tmp/imoveis.db"
          git -C "$tmp" add -f imoveis.db
          if git -C "$tmp" diff --cached --quiet; then
            exit 0
          fi
          git -C "$tmp" -c user.name="bot-imoveis" -c user.email="actions@github.com" \
            commit -qm "estado $(date -u +%FT%TZ) [skip ci]"
          git -C "$tmp" push origin HEAD:refs/heads/data

      - name: Resumo da coleta
        if: always()
        run: python tools/resumo_ciclo.py >> "$GITHUB_STEP_SUMMARY"

      - name: Guarda o log do ciclo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-log-${{ github.run_id }}
          path: |
            bot.log
            relatorio.json
          retention-days: 7
          if-no-files-found: ignore
